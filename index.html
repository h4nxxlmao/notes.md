<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fcfcfc" />
  <meta name="description"
    content="A minimal Markdown notes application with live preview, search, and fast IndexedDB persistence." />
  <title>Markdown Notes</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- made by hanx https://hanx.pro -->
  <!-- last update/touched 26.08.2026 -->

  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h2 id="modal-title" class="modal-title">Delete Note</h2>
      <p class="modal-body">Delete this note permanently? This action cannot be undone.</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="sidebar-backdrop" class="sidebar-backdrop hidden" aria-hidden="true"></div>

  <div class="app-container">

    <aside class="sidebar" id="sidebar" aria-label="Notes sidebar">
      <div class="sidebar-header">
        <span class="app-title">Notes</span>
        <button id="btn-new-note" class="btn btn-primary btn-sm" title="New Note (Ctrl+N)" aria-label="Create new note">+ New</button>
      </div>

      <div class="sidebar-search">
        <input type="search" id="search-input" placeholder="Search notes..." autocomplete="off"
          aria-label="Search notes" />
      </div>

      <div class="sidebar-sort">
        <label for="sort-select" class="sort-label">Sort</label>
        <select id="sort-select" aria-label="Sort notes">
          <option value="modified">Modified</option>
          <option value="created">Created</option>
          <option value="title">Title A-Z</option>
        </select>
      </div>

      <ul id="notes-list" class="notes-list" role="listbox" aria-label="Notes list"></ul>

      <div class="sidebar-footer">
        <span id="notes-count" class="notes-count"></span>
      </div>
    </aside>

    <main class="main-area" id="main-area">

      <div id="empty-state" class="empty-state">
        <p class="empty-state-title">No note selected</p>
        <p class="empty-state-sub">Select a note or create a new one to start writing.</p>
        <button id="btn-new-note-empty" class="btn btn-primary">Create Note</button>
      </div>

      <div id="note-editor" class="note-editor hidden">

        <div class="editor-toolbar">
          <button id="sidebar-toggle" class="sidebar-toggle btn-icon" aria-label="Toggle sidebar" aria-expanded="false" title="Toggle sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="toolbar-left">
            <input type="text" id="note-title-input" class="note-title-input" placeholder="Untitled Note"
              maxlength="200" aria-label="Note title" />
          </div>
          <div class="toolbar-right">
            <span id="save-indicator" class="save-indicator" aria-live="polite"></span>
            <button id="btn-pin" class="btn btn-icon" title="Pin note" aria-label="Pin note" aria-pressed="false">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="17" x2="12" y2="22"></line>
                <path
                  d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
              </svg>
            </button>
            <button id="btn-theme" class="btn btn-icon" title="Toggle theme" aria-label="Toggle color theme">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
            </button>
            <button id="btn-delete" class="btn btn-icon btn-icon-danger" title="Delete note" aria-label="Delete note">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <path d="M10 11v6M14 11v6"></path>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
              </svg>
            </button>
            <button id="btn-toggle-view" class="btn btn-secondary btn-sm" title="Toggle view mode"
              aria-label="Toggle view mode">Preview</button>
          </div>
        </div>

        <div class="editor-panels" id="editor-panels">
          <div class="pane pane-editor" id="pane-editor">
            <div class="pane-header">Editor <span class="shortcut-hint">Ctrl+S to save</span></div>
            <textarea id="markdown-input" class="markdown-input" placeholder="Write Markdown here..." spellcheck="true"
              aria-label="Markdown editor"></textarea>
          </div>

          <div class="pane-divider" id="pane-divider" role="separator" aria-orientation="vertical"></div>

          <div class="pane pane-preview" id="pane-preview">
            <div class="pane-header">Preview</div>
            <div id="preview-output" class="preview-output" aria-label="Markdown preview" aria-live="polite"></div>
          </div>
        </div>

        <div class="editor-footer">
          <span id="char-count" class="char-count"></span>
          <span id="last-modified" class="last-modified"></span>
        </div>

      </div>
    </main>
  </div>

  <footer class="site-footer">
    <span>site made by <a href="https://hanx.pro" target="_blank" rel="noopener noreferrer">hanx.pro</a></span>
  </footer>

  <script src="script.js"></script>
</body>

</html>
